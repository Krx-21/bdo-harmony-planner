<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmony Draught Planner</title>
<meta name="description" content="คำนวณวัตถุดิบ เช็กลิสต์ และคลังสำหรับผลิต [ปาร์ตี้] น้ำยากลมกลืน ทั้ง 4 เผ่า (Black Desert Online) — ล็อกอินด้วย Discord เพื่อซิงก์ข้ามอุปกรณ์">
<meta property="og:title" content="Harmony Draught Planner">
<meta property="og:description" content="BDO [Party] Harmony Draught calculator — materials, checklist, inventory, Discord sync">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Taviraj:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#ecf6f0; --bg2:#deeee6; --panel:#fafdfb; --panel2:#ecf5f0; --line:#d7e8df; --line2:#bad4c7;
  --text:#28362f; --muted:#566b60; --faint:#5e7368;
  --accent:#177a58; --accent2:#4da584; --accent-ink:#fff; --accent-soft:rgba(109,196,160,.2);
  --ok:#2c7a52; --ok-soft:rgba(126,201,164,.22); --warn:#a8532f; --warn-soft:rgba(228,150,112,.2); --bad:#b53357; --bad-soft:rgba(219,109,141,.16);
  --info:#b23a75; --info-soft:rgba(224,130,172,.18);
  --g0:#3e4d45; --g1:#1f7a42; --g2:#3f6bbd; --g3:#8a6410; --g4:#ab511d;
  --shadow:0 1px 2px rgba(40,90,70,.05),0 8px 24px -12px rgba(40,90,70,.16);
  --radius:10px; --radius-s:6px;
  --font-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif;
  --font-display:"Taviraj","IBM Plex Sans Thai",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --bg2:#0e1117; --panel:#1a2029; --panel2:#212934; --line:#2c3542; --line2:#3b4656;
    --text:#e7e2d6; --muted:#9ba3b3; --faint:#8a94a8;
    --accent:#e9bd23; --accent2:#f0cf5a; --accent-ink:#1a1507; --accent-soft:rgba(233,189,35,.13);
    --ok:#57d06a; --ok-soft:rgba(87,208,106,.14); --warn:#ff8a3d; --warn-soft:rgba(255,138,61,.14); --bad:#ff6a5c; --bad-soft:rgba(255,106,92,.14);
    --info:#5fa8ff; --info-soft:rgba(95,168,255,.14);
    --g0:#d7dbe3; --g1:#5dd15d; --g2:#44a3ff; --g3:#e9bd23; --g4:#ff8a00;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --bg2:#0e1117; --panel:#1a2029; --panel2:#212934; --line:#2c3542; --line2:#3b4656;
  --text:#e7e2d6; --muted:#9ba3b3; --faint:#8a94a8;
  --accent:#e9bd23; --accent2:#f0cf5a; --accent-ink:#1a1507; --accent-soft:rgba(233,189,35,.13);
  --ok:#57d06a; --ok-soft:rgba(87,208,106,.14); --warn:#ff8a3d; --warn-soft:rgba(255,138,61,.14); --bad:#ff6a5c; --bad-soft:rgba(255,106,92,.14);
  --info:#5fa8ff; --info-soft:rgba(95,168,255,.14);
  --g0:#d7dbe3; --g1:#5dd15d; --g2:#44a3ff; --g3:#e9bd23; --g4:#ff8a00;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-family:var(--font-display);font-size:22px;letter-spacing:.2px;line-height:1.2}
h2{font-family:var(--font-display);font-size:18px}
h3{font-size:14px;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:12px}
.hide{display:none!important}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;overflow:hidden}
.brand .logo img{width:34px;height:34px;image-rendering:auto}
.brand .sub{font-size:12px;color:var(--muted)}
.topbar .spacer{flex:1}
.tb-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:var(--radius-s);padding:6px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--accent);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.layout{max-width:1440px;margin:0 auto;padding:18px 20px 80px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr);padding:12px 10px 60px}.rail{position:static!important;max-height:none}.topbar .in{padding:8px 10px}}
.rail,.main,.card,.panel{min-width:0}
body{overflow-x:hidden}
.rail{position:sticky;top:68px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 84px);overflow:auto;padding-right:2px}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h2{flex:1;min-width:0}
.card .bd{padding:12px 14px}
.card .bd.tight{padding:6px 8px}

/* ---------- targets ---------- */
.targets{display:flex;flex-direction:column;gap:8px}
.target{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel2)}
.target.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-soft)}
.target .nm{font-weight:600;line-height:1.25;font-size:13px}
.target .nm .en{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.target .nm .badge{display:block;margin-top:3px}.target .nm .badge:empty{display:none}.target .nm .badge .chip{font-size:10.5px;padding:1px 7px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:transparent;width:26px;height:28px;font-size:15px;color:var(--muted)}
.stepper button:hover{background:var(--accent-soft);color:var(--text)}
.stepper input{width:62px;border:0;background:transparent;text-align:center;height:28px;font-family:var(--font-mono);font-size:13px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.target-add{display:flex;gap:6px;align-items:center;margin-top:4px}
.target-add select{flex:1;min-width:0;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);padding:5px 8px;font-size:12.5px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel2)}
.kpi .v{font-family:var(--font-mono);font-size:20px;font-weight:600;line-height:1.1}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.accent .v{color:var(--accent)}
.progress{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .25s}
.progress.part i{background:var(--accent)}

/* ---------- settings ---------- */
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:12.5px}
.field .hint{display:block;font-size:11px;color:var(--muted)}
.field input[type=number]{width:72px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);padding:4px 6px;text-align:right;font-family:var(--font-mono);font-size:13px}
.toggle{position:relative;width:36px;height:20px;border-radius:999px;background:var(--line2);border:0;flex:none}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle[aria-checked="true"] i{left:18px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 4px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tabs .cnt{font-family:var(--font-mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{flex:1;min-width:160px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);padding:6px 10px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--muted);background:var(--panel2)}
.chip.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.chip.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.chip.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.chip.info{border-color:transparent;background:var(--info-soft);color:var(--info)}
.chip.acc{border-color:transparent;background:var(--accent-soft);color:var(--accent)}

/* ---------- item rows ---------- */
.group-hd{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;color:var(--muted);font-size:12px}
.group-hd h3{font-size:13px;color:var(--text)}
.group-hd .ln{flex:1;height:1px;background:var(--line)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:44px minmax(190px,1.3fr) 84px 118px 84px minmax(190px,2fr) 70px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row{border-left:3px solid transparent}
.row.done{border-left-color:var(--ok)}
.row.short{border-left-color:var(--bad)}
@media (max-width:860px){
  .row{grid-template-columns:40px minmax(0,1fr) 72px 92px 72px;gap:8px;padding:8px 10px}
  .row .cell-bar{grid-column:2 / 5}
  .row .cell-act{grid-column:5 / 6;justify-content:flex-end}
  .subrows{padding-left:0}
}
@media (max-width:600px){
  .row{grid-template-columns:40px minmax(0,1fr) auto auto;grid-template-areas:"ic nm nm act" "ic need have short" "ic bar bar bar" "sub sub sub sub";gap:6px 8px;align-items:start}
  .row>.ic{grid-area:ic}.row>.nm{grid-area:nm}.row>.cell-act{grid-area:act;justify-self:end}
  .row>.cell-need{grid-area:need;text-align:left}.row>.cell-have{grid-area:have}.row>.cell-short{grid-area:short;text-align:left}
  .row>.cell-bar{grid-area:bar}.row>.subrows{grid-area:sub}
  .cell-need .v,.cell-short .v{font-size:14px}
  .subrow{grid-template-columns:26px 1fr 60px 80px}
}
@media (pointer:coarse){ .stepper button{width:34px;height:34px} .stepper input{height:34px} .iconbtn{width:34px;height:34px} .step .chk{width:30px;height:30px} .cell-have input{padding:8px 6px} }
.ic{width:40px;height:40px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);display:grid;place-items:center;overflow:hidden;position:relative}
.ic img{width:36px;height:36px;display:block}
.ic.g1{border-color:var(--g1)} .ic.g2{border-color:var(--g2)} .ic.g3{border-color:var(--g3)} .ic.g4{border-color:var(--g4)}
.ic.sm{width:26px;height:26px;border-radius:5px}.ic.sm img{width:22px;height:22px}
.ic.xs{width:20px;height:20px;border-radius:4px;border-width:1px}.ic.xs img{width:17px;height:17px}
.nm{min-width:0}
.nm .t{font-weight:600;font-size:13.5px;line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm .t .g1{color:var(--g1)}.nm .t .g2{color:var(--g2)}.nm .t .g3{color:var(--g3)}.nm .t .g4{color:var(--g4)}
.nm .s{font-size:11.5px;color:var(--muted);line-height:1.3;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--muted);line-height:1.5;white-space:nowrap}
.tag.key{border-color:var(--warn);color:var(--warn)}
.tag.sub{border-color:var(--info);color:var(--info)}
button.tagbtn{background:var(--info-soft);cursor:pointer;font-family:inherit}
button.tagbtn:hover{background:var(--info);color:#fff}
.cell-need{text-align:right}
.cell-need .v{font-family:var(--font-mono);font-size:15px;font-weight:600}
.cell-need .l{font-size:10.5px;color:var(--muted)}
.cell-have{display:flex;align-items:center;gap:4px}
.cell-have input{width:92px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);padding:5px 6px;text-align:right;font-family:var(--font-mono);font-size:13px;-moz-appearance:textfield}
.cell-have input::-webkit-outer-spin-button,.cell-have input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cell-have input:focus{border-color:var(--accent)}
.cell-have .eq{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.cell-short{text-align:right}
.cell-short .v{font-family:var(--font-mono);font-size:14px;font-weight:600}
.cell-short.ok .v{color:var(--ok)} .cell-short.bad .v{color:var(--bad)}
.cell-short .l{font-size:10.5px;color:var(--muted)}
.cell-bar{display:flex;flex-direction:column;gap:4px;min-width:0}
.cell-bar .uses{font-size:11px;color:var(--muted);display:flex;gap:3px 10px;flex-wrap:wrap;line-height:1.2}
.cell-bar .uses>span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.cell-bar .uses b{font-weight:500;color:var(--text)}
.cell-act{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.iconbtn{border:1px solid var(--line2);background:var(--panel2);border-radius:6px;width:28px;height:28px;display:inline-grid;place-items:center;font-size:13px;color:var(--muted)}
.iconbtn:hover{border-color:var(--accent);color:var(--text)}
.subrows{grid-column:1 / -1;padding:6px 0 2px 54px;display:flex;flex-direction:column;gap:4px}
.subrow{display:grid;grid-template-columns:26px 1fr 70px 100px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.subrow .v{font-family:var(--font-mono);color:var(--muted);font-size:11.5px;text-align:right}
.subrow input{width:92px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);padding:3px 6px;text-align:right;font-family:var(--font-mono);font-size:12.5px}

/* ---------- steps ---------- */
.tier{margin:0}
.tier-hd{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.tier-hd .n{font-family:var(--font-display);font-size:13px;color:var(--accent);letter-spacing:.06em;border:1px solid var(--accent);border-radius:999px;padding:0 9px}
.tier-hd h3{font-size:13.5px}
.tier-hd .ln{flex:1;height:1px;background:var(--line)}
.step{display:grid;grid-template-columns:28px 44px minmax(200px,1.2fr) minmax(220px,2fr) auto;gap:12px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
@media (max-width:900px){.step{grid-template-columns:28px 44px 1fr}.step .mats,.step .act{grid-column:2 / -1}}
.step{border-left:3px solid transparent}
.step.done{border-left-color:var(--ok);opacity:.75}
.step.ready{border-left-color:var(--accent)}
.step.blocked{border-left-color:var(--bad)}
.step .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center;margin-top:9px;color:var(--ok);font-size:14px;background:var(--panel2);padding:0;cursor:pointer}
.step .chk:hover:not(:disabled){border-color:var(--ok)}
.step.done .chk:hover{border-color:var(--bad);color:var(--bad)}
.step.done .chk{border-color:var(--ok);background:var(--ok-soft)}
.step .title{font-weight:600;font-size:13.5px;line-height:1.25}
.step .meta{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.step .counts{font-family:var(--font-mono);font-size:12px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.step .counts b{color:var(--accent);font-weight:600}
.mats{display:flex;flex-direction:column;gap:4px}
.mat{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;font-size:12.5px;line-height:1.2}
.mat .q{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.mat .q b{color:var(--text);font-weight:500}
.mat.ok .q i{color:var(--ok);font-style:normal}
.mat.bad .q i{color:var(--bad);font-style:normal}
.step .act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.craft{display:flex;gap:4px;align-items:center}
.craft input{width:66px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);padding:4px 6px;text-align:right;font-family:var(--font-mono);font-size:12.5px}

/* ---------- tree ---------- */
.tree{padding:6px 10px 12px;font-size:13px}
.tree details{margin-left:0}
.tree details details{margin-left:22px;border-left:1px dashed var(--line2);padding-left:10px;min-width:0}
@media (max-width:600px){.tree details details{margin-left:10px;padding-left:6px}.tree .leaf{padding-left:18px}}
.tree summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px 8px;padding:4px 6px;border-radius:6px;flex-wrap:wrap;min-width:0}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{background:var(--panel2)}
.tree summary .car{width:14px;color:var(--muted);font-size:10px;transition:transform .15s}
.tree details[open] > summary .car{transform:rotate(90deg)}
.tree .leaf{display:flex;align-items:center;gap:6px 8px;padding:3px 6px 3px 28px;flex-wrap:wrap;min-width:0}
.tree .q{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tree .q b{color:var(--text)}
.tree .rt{font-size:11px;color:var(--faint);margin-left:4px}

/* ---------- misc ---------- */
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);padding:8px 14px;border-top:1px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:all .2s;pointer-events:none;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--text);padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
dialog .hd h2{flex:1}
dialog .bd{padding:14px 16px;max-height:70vh;overflow:auto}
dialog textarea{width:100%;min-height:180px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);font-family:var(--font-mono);font-size:12px;padding:8px}
.recipe-pick{display:flex;flex-direction:column;gap:8px}
.recipe-opt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.recipe-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.recipe-opt .mats{flex:1}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{.topbar,.rail,.toolbar,.cell-act,.step .act{display:none!important}.layout{grid-template-columns:1fr}.card{box-shadow:none}}
</style>
</head>

/* ===================== state ===================== */
const LS_KEY = 'hdp-state-v1';
const freshState = () => ({ targets:{}, inv:{}, carry:{}, ledger:{}, yield:2.5, strong3:true, showDone:true, recipeChoice:{}, lang:'th', theme:'auto', onlyShort:false, filterCat:'', history:[] });

function sanitizeState(st){ const num = o => Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[+k, Math.max(0,+v||0)]).filter(([k,v])=>!isNaN(k))); st.targets=num(st.targets); st.inv=num(st.inv); st.carry=num(st.carry); st.yield=Math.min(4, Math.max(1, +st.yield||2.5)); if(!I18N[st.lang]) st.lang='th'; if(!THEMES.includes(st.theme)) st.theme='auto'; if(!TABS.includes(st.tab)) st.tab='mats'; const rc={}; for(const [k,v] of Object.entries(st.recipeChoice||{})){ if(v==='none' || (Object.hasOwn(DATA.recipes,v) && (DATA.altRecipes[k]||[]).includes(v))) rc[k]=v; } st.recipeChoice=rc; if(!Array.isArray(st.history)) st.history=[]; if(!st.ledger || typeof st.ledger!=='object' || Array.isArray(st.ledger)) st.ledger={}; return st; }
function loadState(){ try{ const s = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(s){ return sanitizeState(Object.assign(freshState(), s)); } }catch(e){} const s = freshState(); for(const r of DATA.roots) s.targets[r]=0; return s; }

/* ===================== model ===================== */
const R = DATA.recipes, IT = DATA.items, GR = DATA.groups;
function recipeOf(id){ const choice = S.recipeChoice[id]; if(choice==='none') return null; if(choice && Object.hasOwn(R, choice)) return R[choice]; const d = DATA.defaultRecipe[id]; return d ? R[d] : null; }
function yieldOf(rec, product){ const p = rec.products.find(p=>p.id==product) || rec.products[0]; const base = p ? p.qty : 1; const y = +S.yield; return rec.kind==='alchemy' ? base * (y>0 ? y : 1) : base; }
// effective inventory for an item id: own + strong equivalents + group members (by value)
let GRAPH = new Set();   // ids that have their own demand line in the current plan (not counted as substitutes elsewhere)
let PERCRAFT = {};  // id -> max per-craft qty demanded by any parent (caps substitute value: 1 HQ covers one craft, not 12)
function subVal(id, v){ const cap = PERCRAFT[id] || DATA.minUse[id] || 1; return Math.min(v, cap); }
function haveEff(id){
  let h = +S.inv[id]||0;
  if(S.strong3){ for(const s of (DATA.strongOf[id]||[])) if(!GRAPH.has(s.id)) h += (+S.inv[s.id]||0) * s.ratio; }
  const gid = IT[id]?.group;
  if(gid && GR[gid]){ for(const m of GR[gid]){ if(m.id!=id && !GRAPH.has(m.id)) h += (+S.inv[m.id]||0) * subVal(id, m.value); } }
  return h;
}
function ceilq(x){ return Math.max(0, Math.ceil(x - 1e-9)); }

// compute plan: demand per item (from all parents), crafts, shortages, usedBy
function compute(){
  const demand = {}, usedBy = {}, order = [], depth = {}, rootsOf = {};
  // topological order: compute depth by DFS over chosen recipes (longest path); also which active targets reach each item
  const visiting = new Set(); const seenPair = new Set();
  function dfs(id, d, root){ depth[id] = Math.max(depth[id]||0, d); (rootsOf[id] ||= new Set()).add(root); if(visiting.has(id)) return; const pk = id+':'+root+':'+d; if(seenPair.has(pk)) return; seenPair.add(pk); visiting.add(id); const rec = recipeOf(id); if(rec){ for(const m of rec.mats) dfs(m.id, d+1, root); } visiting.delete(id); }
  for(const k of Object.keys(S.targets)){ const n=Math.max(0,+S.targets[k]||0); S.targets[k]=n; }
  for(const [id,q] of Object.entries(S.targets)) if(q>0) dfs(+id, 0, +id);
  const ids = Object.keys(depth).map(Number).sort((a,b)=>depth[a]-depth[b]);
  GRAPH = new Set(ids); PERCRAFT = {};
  for(const [id,q] of Object.entries(S.targets)) if(q>0){ demand[id] = (demand[id]||0) + q; }
  const res = {};
  for(const id of ids){
    const dm = demand[id]||0; const have = haveEff(id); const rec = recipeOf(id);
    const short = Math.max(0, dm - have);
    let crafts = 0, perCraft = 0;
    if(rec && short>0){ perCraft = yieldOf(rec, id); crafts = ceilq(short / perCraft); for(const m of rec.mats){ const q = crafts * m.qty; demand[m.id] = (demand[m.id]||0) + q; PERCRAFT[m.id] = PERCRAFT[m.id] ? Math.min(PERCRAFT[m.id], m.qty) : m.qty; (usedBy[m.id] ||= []).push({id, qty:q}); } }
    res[id] = { id, demand:dm, have, short, crafts, perCraft, rec, depth:depth[id], leaf: !rec, roots: rootsOf[id] ? [...rootsOf[id]] : [] };
  }
  for(const id of ids){ res[id].usedBy = usedBy[id]||[]; }
  return { res, ids };
}

/* ===================== helpers ===================== */
const fmt = n => { if(n==null||isNaN(n)) return '0'; if(Math.abs(n - Math.round(n)) < 1e-6) return Math.round(n).toLocaleString('en-US'); return n.toLocaleString('en-US',{maximumFractionDigits:1}); };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icon(id, cls='ic'){ const it = IT[id]; const g = it?.grade||0; const src = it?.icon_b64 || ''; return `<span class="${cls} g${g}" title="${esc(nameOf(id))}">${src?`<img src="${esc(src)}" alt="">`:''}</span>`; }
function gcls(id){ return 'g'+(IT[id]?.grade||0); }
function hasSrc(id){ const s=IT[id]?.src; return !!(s && (s.vendor?.count||s.gather?.count||s.nodes)); }
function catOf(id){ if(!hasSrc(id) && DATA.defaultRecipe[id]) return 'market'; return DATA.category[id] || (IT[id]?.src?.vendor?.count>0 ? 'vendor' : 'gather'); }
function srcLine(id){ const s = IT[id]?.src; const parts=[]; if(s){ if(s.vendor?.count){ parts.push(LANG==='th' ? `${t('vendorNames')}: ${s.vendor.names.slice(0,3).join(', ')}${s.vendor.count>3?' +'+(s.vendor.count-3):''}` : `Sold by ${s.vendor.count} NPC${s.vendor.count>1?'s':''}`);} if(s.gather?.count){ parts.push(LANG==='th' ? `${t('gatherFrom')}: ${s.gather.names.slice(0,3).join(', ')}` : `Gatherable (${s.gather.count} source${s.gather.count>1?'s':''})`);} if(s.nodes){ parts.push(`${s.nodes} ${t('nodes')}`);} if(s.mobdrop){ parts.push(LANG==='th'?`ดรอป/ชำแหละจากมอนสเตอร์ ${s.mobdrop} ชนิด`:`drops from ${s.mobdrop} monsters`);} } if(!parts.length){ parts.push(DATA.defaultRecipe[id] ? (LANG==='th'?'ซื้อตลาดกลาง หรือกด ⚗ เพื่อผลิตเอง':'Central Market, or press ⚗ to craft') : (LANG==='th'?'ตลาดกลาง / ดรอป':'Central Market / drop')); } return parts.join(' · '); }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1800); }
function applyI18n(){ document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n)); document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh)); document.documentElement.lang = LANG; document.getElementById('langTH').setAttribute('aria-pressed', LANG==='th'); document.getElementById('langEN').setAttribute('aria-pressed', LANG==='en'); }

function renderTargets(){
  const box = document.getElementById('targets'); const ids = Object.keys(S.targets).map(Number);
  const roots = DATA.roots.filter(r=>ids.includes(r)).concat(ids.filter(i=>!DATA.roots.includes(i)));
  const badge = id => { if(!(S.targets[id]>0) || !LAST) return ''; const P=LAST; const sub = P.ids.filter(i=>P.res[i].roots.includes(id)); const stepsLeft = sub.filter(i=>!P.res[i].leaf && P.res[i].crafts>0).length; const leafShort = sub.filter(i=>P.res[i].leaf && P.res[i].short>0).length; if(P.res[id] && P.res[id].short===0) return `<span class="chip ok">✓ ${LANG==='th'?'มีครบแล้ว':'in stock'}</span>`; if(!stepsLeft && !leafShort) return `<span class="chip ok">✓ ${t('ready')}</span>`; return `<span class="chip ${leafShort?'warn':'acc'}" title="${LANG==='th'?'ขั้นตอนที่เหลือ · วัตถุดิบที่ยังขาด':'steps left · materials short'}">${stepsLeft} ${LANG==='th'?'ขั้น':'steps'} · ${leafShort} ${LANG==='th'?'ขาด':'short'}</span>`; };
  box.innerHTML = roots.map(id=>`<div class="target ${S.targets[id]>0?'active':''}" data-id="${id}">${icon(id)}<div class="nm"><span class="${gcls(id)}">${esc(nameOf(id))}</span><span class="en">${esc(otherName(id))}</span><span class="badge">${badge(id)}</span></div>

  const tot = Object.values(S.targets).reduce((a,b)=>a+(+b||0),0); const tt=document.getElementById('targetTotal'); tt.textContent = tot? `${fmt(tot)} ${LANG==='th'?'ขวด':'total'}` : ''; tt.classList.toggle('hide', !tot);

  const sel = document.getElementById('addTargetSel'); const have = new Set(ids);
  sel.innerHTML = `<option value="">${LANG==='th'?'เพิ่มเป้าหมายอื่น (เช่น น้ำยาแต่ละตัว)…':'Add another target (any craftable)…'}</option>` + DATA.craftables.filter(i=>!have.has(i)).map(i=>`<option value="${i}">${esc(nameOf(i))}</option>`).join('');
}
document.getElementById('addTargetBtn').onclick = ()=>{ const v=+document.getElementById('addTargetSel').value; if(v){ S.targets[v]=1; update(); } };

function renderKpis(P){
  const leafShort = P.ids.filter(i=>P.res[i].leaf && P.res[i].short>0);
  const steps = P.ids.filter(i=>!P.res[i].leaf && P.res[i].demand>0);
  const stepsLeft = steps.filter(i=>P.res[i].crafts>0);
  let weight = 0; for(const i of leafShort){ weight += (IT[i]?.weight||0) * P.res[i].short; }
  // readiness: weighted by leaf demand coverage
  let nT=0, cov=0; for(const i of P.ids){ const r=P.res[i]; if(r.leaf && r.demand>0){ nT++; cov+=Math.min(1, r.have/r.demand); } }
  const totalT = Object.values(S.targets).reduce((a,b)=>a+(+b||0),0);
  const pct = nT>0 ? Math.round(100*cov/nT) : (totalT>0?100:0);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi ${leafShort.length?'warn':'ok'}"><div class="v">${leafShort.length}</div><div class="l">${t('kpi_types')}</div></div>
    <div class="kpi ${stepsLeft.length?'accent':'ok'}"><div class="v">${stepsLeft.length}<span class="muted" style="font-size:12px">/${steps.length}</span></div><div class="l">${t('kpi_steps')}</div></div>
    <div class="kpi"><div class="v">${fmt(Math.round(weight*10)/10)}</div><div class="l">${t('kpi_weight')}</div></div>
    <div class="kpi ${pct>=100?'ok':''}"><div class="v">${pct}%</div><div class="l">${t('kpi_pct')}</div></div>`;
  const bar = document.getElementById('mainBar'); bar.querySelector('i').style.width = pct+'%'; bar.classList.toggle('part', pct<100);
  document.getElementById('mainBarLabel').textContent = totalT? (LANG==='th'?`วัตถุดิบพื้นฐานพร้อม ${pct}% ของที่ต้องใช้ทั้งหมด`:`${pct}% of base materials on hand`) : t('noTargets');
}

function matchSearch(id){ const q=(document.getElementById('search').value||'').trim().toLowerCase(); if(!q) return true; const it=IT[id]||{}; return (it.th||'').toLowerCase().includes(q)||(it.en||'').toLowerCase().includes(q); }
function rowHTML(r, opts={}){
  const id=r.id, it=IT[id]||{}; const gid=it.group; const strongs = DATA.strongOf[id]||[];
  const eqParts=[]; if(S.strong3&&strongs.length){ const sh = strongs.filter(s=>!GRAPH.has(s.id)).reduce((a,s)=>a+(+S.inv[s.id]||0),0); if(sh) eqParts.push(`+${fmt(sh)}×3`); }

  const noneOn = S.recipeChoice[id]==='none' || (!cur);
  const noneOpt = `<div class="recipe-opt ${noneOn?'on':''}" data-k="none"><div><input type="radio" name="rp" ${noneOn?'checked':''}></div><div class="mats"><div class="small" style="font-weight:600">${LANG==='th'?'ไม่ผลิตเอง — ซื้อ/หามาแทน':'Do not craft — buy / gather instead'}</div><div class="small muted">${LANG==='th'?'จะไปอยู่ในแท็บ “วัตถุดิบที่ต้องหา” แทน':'Will appear under “Materials to get” instead'}</div></div></div>`;
  document.getElementById('dlgBody').innerHTML = `<div class="recipe-pick">${noneOpt}${alts.map(k=>{ const r=R[k]; const on = r===cur; return `<div class="recipe-opt ${on?'on':''}" data-k="${k}"><div><input type="radio" name="rp" ${on?'checked':''}></div><div class="mats"><div class="small muted" style="margin-bottom:4px">${esc(typeName(r.type))} · ${esc(levelName(r.level))} → ${r.products.filter(p=>p.id==id).map(p=>`${esc(nameOf(p.id))} ×${p.qty}${r.kind==='alchemy'?` (≈${S.yield}/${LANG==='th'?'ครั้ง':'craft'})`:''}`).join(', ')}${r.products.some(p=>p.id!=id)?` <span class="faint">(${LANG==='th'?'อาจได้เพิ่ม':'may also yield'}: ${r.products.filter(p=>p.id!=id).map(p=>esc(nameOf(p.id))).join(', ')})</span>`:''}${DATA.batchNote[k]?` · <span class="chip acc">${t('batch10')}</span>`:''}</div>${r.mats.map(m=>`<div class="mat">${icon(m.id,'ic xs')}<span class="${gcls(m.id)}">${esc(nameOf(m.id))}</span><span class="q"><b>${m.qty}</b></span></div>`).join('')}</div></div>`; }).join('')}</div>`;
  document.getElementById('dlgBody').querySelectorAll('.recipe-opt').forEach(o=>o.onclick=()=>{ S.recipeChoice[id]=o.dataset.k; dlg.close(); update(); });
  dlg.showModal();
}
document.getElementById('dlgClose').onclick=()=>document.getElementById('dlg').close();

/* ===================== render: inventory (all items) ===================== */
function renderInv(P){
  const el=document.getElementById('panel-inv');
  const all = Object.keys(IT).map(Number).filter(i=>DATA.relevant.includes(i)).filter(matchSearch).filter(i=>!S.onlyShort || (P.res[i] && P.res[i].short>0));
  const withQty = all.filter(i=>S.inv[i]>0).length; document.getElementById('cntInv').textContent = withQty||'';
  const tiers = {};
  for(const i of all){ const d = DATA.tierOf[i] ?? 99; (tiers[d] ||= []).push(i); }
  let h=`<div class="note" style="border-top:0">${t('invHint')}</div>`;
  const keys = Object.keys(tiers).map(Number).sort((a,b)=>a-b);
  for(const d of keys){
    h += `<div class="group-hd"><h3>${esc(DATA.tierNames[LANG][d]||(LANG==='th'?'อื่นๆ':'Other'))}</h3><span class="ln"></span></div><div class="rows">`;
    const dem = i => (P.res[i]?.demand||0);
    for(const i of tiers[d].sort((a,b)=> (dem(b)>0)-(dem(a)>0) || (IT[a].grade||0)-(IT[b].grade||0) || nameOf(a).localeCompare(nameOf(b)))){ const r = P.res[i] || {id:i, demand:0, have:haveEff(i), short:0, usedBy:[], leaf:!recipeOf(i)}; h += rowHTML(r,{src:r.leaf}); }
    h += `</div>`;
  }
  el.innerHTML=h; bindRows(el);
}

/* ===================== render: tree ===================== */
const TREE_OPEN = new Set(), TREE_CLOSED = new Set();   // explicit user toggles, by path
document.getElementById('panel-tree').addEventListener('toggle', e=>{ const d=e.target; if(d.tagName!=='DETAILS'||!d.dataset.p) return; if(d.open){ TREE_OPEN.add(d.dataset.p); TREE_CLOSED.delete(d.dataset.p); } else { TREE_CLOSED.add(d.dataset.p); TREE_OPEN.delete(d.dataset.p); } }, true);
function renderTree(P){
  const el=document.getElementById('panel-tree');
  const roots = Object.entries(S.targets).filter(([i,q])=>q>0).map(([i])=>+i);
  if(!roots.length){ el.innerHTML=`<div class="empty">${t('noTargets')}</div>`; return; }
  function node(id, perParent, total, depth, open){
    const rec = recipeOf(id); const r = P.res[id]; total = r ? r.demand : null;
    const q = `<span class="q"><b>×${fmt(perParent)}</b>${total!=null?` <span class="rt">(${LANG==='th'?'ทั้งแผน':'plan total'} ${fmt(total)})</span>`:''}</span>`;
    if(!rec) return `<div class="leaf">${icon(id,'ic sm')}<span class="${gcls(id)}">${esc(nameOf(id))}</span>${q}</div>`;
    const y = yieldOf(rec,id); const path = (arguments[5]||'')+'/'+id; const isOpen = TREE_OPEN.has(path) ? true : (TREE_CLOSED.has(path) ? false : open);
    return `<details ${isOpen?'open':''} data-p="${path}"><summary><span class="car">▶</span>${icon(id,'ic sm')}<span class="${gcls(id)}">${esc(nameOf(id))}</span><span class="chip ${rec.kind==='alchemy'?'info':'acc'}" style="margin-left:4px">${esc(typeName(rec.type))} · ${rec.kind==='alchemy'?`≈${S.yield}`:fmt(y)}/${LANG==='th'?'ครั้ง':'craft'}</span>${q}</summary>
      ${rec.mats.map(m=>{ const per = m.qty; return node(m.id, per, null, depth+1, depth<1, path); }).join('')}</details>`;
  }
  el.innerHTML = `<div class="note" style="border-top:0">${t('treeHint')}</div><div class="tree">${roots.map(id=>node(id, S.targets[id], S.targets[id], 0, true)).join('')}</div>`;
  // totals in tree: above uses r.crafts*m.qty which is the total demand contributed by this parent's crafts — good enough
}

/* ===================== main update ===================== */
let LAST=null;
const DIRTY = {mats:true, steps:true, inv:true, tree:true};
const RENDER = {mats:P=>renderMats(P), steps:P=>renderSteps(P), inv:P=>renderInv(P), tree:P=>renderTree(P)};
function renderPanel(name){ if(!LAST) return; RENDER[name](LAST); DIRTY[name]=false; }
function update(keepScroll){
  const y = window.scrollY; const pf = PENDING_FOCUS; PENDING_FOCUS=null;
  LAST = compute();
  renderTargets(); renderKpis(LAST);
  for(const k of TABS) DIRTY[k]=true;
  renderPanel(S.tab||'mats');
  // counters for the hidden tabs (cheap)
  document.getElementById('cntMats').textContent = LAST.ids.filter(i=>LAST.res[i].leaf&&LAST.res[i].short>0).length || '';
  document.getElementById('cntSteps').textContent = LAST.ids.filter(i=>!LAST.res[i].leaf&&LAST.res[i].crafts>0).length || '';
  save(); syncHash();
  if(keepScroll){ window.scrollTo(0,y); }
  if(pf!=null){ const dlgEl=document.getElementById('dlg'); const vis=[...document.querySelectorAll('.panel')].find(p=>!p.classList.contains('hide')); const scope = (dlgEl && dlgEl.open) ? dlgEl : (vis||document); const el=scope.querySelector(`input[data-inv="${pf}"]`); if(el){ el.focus(); el.select(); } }
}
function syncHash(){ try{ const hp = new URLSearchParams(location.hash.replace(/^#/,'')); const tp = Object.entries(S.targets).filter(([i,q])=>q>0).map(([i,q])=>`${i}:${q}`).join(','); if(tp) hp.set('t', tp); else hp.delete('t'); if(S.tab && S.tab!=='mats') hp.set('tab', S.tab); else hp.delete('tab'); const qs = hp.toString().replace(/%3A/g,':').replace(/%2C/g,','); const h = qs? '#'+qs : ''; if(location.hash!==h){ LAST_HASH_APPLIED=h; history.replaceState(null,'',location.pathname+location.search+h); } }catch(e){} }
function setTab(name){ if(!TABS.includes(name)) name='mats'; document.querySelectorAll('#tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===name))); document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('hide', p.id!=='panel-'+name)); S.tab=name; renderFilters(); if(DIRTY[name]) renderPanel(name); save(); syncHash(); }
document.querySelectorAll('#tabs [role=tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
let SEARCH_T=null; document.getElementById('search').oninput = ()=>{ clearTimeout(SEARCH_T); SEARCH_T=setTimeout(()=>{ for(const k of TABS) DIRTY[k]=true; renderPanel(S.tab||'mats'); }, 160); };
function renderFilters(){ const f=document.getElementById('filters'); const tab=S.tab||'mats';
  if(tab==='tree'){ f.innerHTML=''; return; }
  const shortLabel = tab==='steps' ? (LANG==='th'?'เฉพาะที่ยังไม่เสร็จ':'Only unfinished') : t('onlyShort');
  const cats = tab==='mats' ? CATS.map(c=>`<button class="chip ${S.filterCat===c?'on':''}" data-cat="${c}">${t('src_'+c)}</button>`).join('') : '';
  f.innerHTML = `<button class="chip ${S.onlyShort?'on':''}" id="fShort">${shortLabel}</button>` + cats;
  f.querySelector('#fShort').onclick=()=>{S.onlyShort=!S.onlyShort; renderFilters(); update(true);};
  f.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ S.filterCat = S.filterCat===b.dataset.cat?'':b.dataset.cat; renderFilters(); update(true); }); }

/* ===================== top bar ===================== */
function setLang(l){ LANG=l; S.lang=l; applyI18n(); renderSettings(); renderFilters(); update(true); }
document.getElementById('langTH').onclick=()=>setLang('th'); document.getElementById('langEN').onclick=()=>setLang('en');
function setTheme(th){ if(!THEMES.includes(th)) th='auto'; S.theme=th; if(th==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th); ['Auto','Light','Dark'].forEach(n=>document.getElementById('th'+n).setAttribute('aria-pressed', String(th===n.toLowerCase()))); save(); }
document.getElementById('thAuto').onclick=()=>setTheme('auto'); document.getElementById('thLight').onclick=()=>setTheme('light'); document.getElementById('thDark').onclick=()=>setTheme('dark');
document.getElementById('btnShare').onclick=()=>{ syncHash(); const url=location.href; (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast(LANG==='th'?'คัดลอกลิงก์เป้าหมายแล้ว':'Link copied')).catch(()=>prompt('URL', url)); };
document.getElementById('btnExport').onclick=()=>{ const data=JSON.stringify({targets:S.targets, inv:S.inv, carry:S.carry||{}, ledger:S.ledger||{}, yield:S.yield, strong3:S.strong3, recipeChoice:S.recipeChoice}, null, 1); const dlg=document.getElementById('dlg'); document.getElementById('dlgTitle').textContent=t('export'); document.getElementById('dlgBody').innerHTML=`<p class="small muted">${LANG==='th'?'คัดลอกข้อความนี้เก็บไว้ หรือดาวน์โหลดเป็นไฟล์':'Copy this text or download as a file'}</p><textarea id="exp" readonly>${esc(data)}</textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" id="expCopy">Copy</button><button class="btn" id="expDl">Download .json</button></div>`; dlg.showModal(); document.getElementById('expCopy').onclick=()=>{ navigator.clipboard?.writeText(data); toast(t('exported')); }; document.getElementById('expDl').onclick=()=>{ const a=document.createElement('a'); a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data); a.download='harmony-planner.json'; a.click(); toast(t('exported')); }; };
document.getElementById('btnImport').onclick=()=>{ const dlg=document.getElementById('dlg'); document.getElementById('dlgTitle').textContent=t('import'); document.getElementById('dlgBody').innerHTML=`<textarea id="imp" placeholder="{ ... }"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" id="impOk">OK</button><input type="file" id="impFile" accept=".json"></div>`; dlg.showModal(); document.getElementById('impFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(tx=>document.getElementById('imp').value=tx); }; document.getElementById('impOk').onclick=()=>{ try{ const d=JSON.parse(document.getElementById('imp').value); const num = o => Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[+k, Math.max(0,+v||0)]).filter(([k,v])=>!isNaN(k))); if(d.targets) S.targets=num(d.targets); if(d.inv) S.inv=num(d.inv); if(d.yield) S.yield=Math.min(4, Math.max(1, +d.yield||2.5)); if('strong3' in d) S.strong3=!!d.strong3; if(d.recipeChoice && typeof d.recipeChoice==='object') S.recipeChoice=d.recipeChoice; if(d.carry) S.carry=num(d.carry); if(d.ledger && typeof d.ledger==='object') S.ledger=d.ledger; sanitizeState(S); dlg.close(); renderSettings(); update(); toast(t('imported')); }catch(e){ alert('Invalid JSON'); } }; };
document.getElementById('btnReset').onclick=()=>{ if(confirm(t('resetQ'))){ try{ localStorage.removeItem(LS_KEY); }catch(e){} S=freshState(); for(const r of DATA.roots) S.targets[r]=0; S.lang=LANG; S.theme=document.documentElement.dataset.theme||'auto'; TREE_OPEN.clear(); TREE_CLOSED.clear(); renderSettings(); renderFilters(); update(); toast(LANG==='th'?'ล้างค่าแล้ว':'Reset done'); } };

/* ===================== init ===================== */
// URL hash: #t=1407:5,1401:2  (targets)  &tab=steps  &lang=en  &theme=dark
let LAST_HASH_APPLIED = null;
function parseHash(){ try{ if(location.hash===LAST_HASH_APPLIED) return false; LAST_HASH_APPLIED=location.hash; const hp = new URLSearchParams(location.hash.replace(/^#/,'')); const tp = hp.get('t'); if(tp!=null){ for(const k of Object.keys(S.targets)) S.targets[k]=0; for(const pair of tp.split(',')){ const [i,q]=pair.split(':'); if(IT[+i]) S.targets[+i]=Math.max(0,+q||0); } } const L=(hp.get('lang')||'').toLowerCase(); if(I18N[L]) { LANG=L; S.lang=L; applyI18n(); renderSettings(); renderFilters(); } const tb=hp.get('tab'); if(TABS.includes(tb)) S.tab=tb; const th=hp.get('theme'); if(THEMES.includes(th)) setTheme(th); return true; }catch(e){ return false; } }
(function init(){
  LANG = S.lang||'th'; applyI18n(); setTheme(S.theme||'auto'); renderSettings(); renderFilters();
  const logo = IT[DATA.roots[3]]?.icon_b64 || IT[DATA.roots[0]]?.icon_b64; if(logo) document.getElementById('logoImg').src=logo;
  for(const r of DATA.roots) if(!(r in S.targets)) S.targets[r]=0;
  parseHash(); update(); setTab(S.tab||'mats');
  window.addEventListener('hashchange', ()=>{ if(parseHash()){ update(); setTab(S.tab||'mats'); } });
})();
</script>

<script>
/* ===== web layer: Discord login + cloud sync (Vercel) ===== */
(function(){
  if(location.protocol==='file:') return;
  const bar=document.querySelector('.tb-group'); if(!bar) return;
  const wrap=document.createElement('span'); wrap.style.cssText='display:inline-flex;align-items:center;gap:6px';
  bar.insertBefore(wrap, bar.firstChild);
  const btn=document.createElement('button'); btn.className='btn'; btn.type='button'; wrap.appendChild(btn);
  const stat=document.createElement('span'); stat.className='small muted'; wrap.appendChild(stat);
  // favicon from embedded icon
  try{ const l=document.createElement('link'); l.rel='icon'; l.href=IT[1407].icon_b64; document.head.appendChild(l); }catch(e){}
  let USER=null, CFG={oauth:false,storage:false}, syncT=null, lastPushed='', hooked=false;
  const av=u=>u.avatar?`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=64`:'https://cdn.discordapp.com/embed/avatars/0.png';
  function renderBtn(){
    if(USER){
      btn.innerHTML=`<img src="${av(USER)}" referrerpolicy="no-referrer" alt="" style="width:18px;height:18px;border-radius:50%;vertical-align:-4px"> ${USER.name.replace(/</g,'&lt;')}`;
      btn.title=(LANG==='th'?'กดเพื่อออกจากระบบ':'Click to log out');
      btn.onclick=()=>{ if(confirm(LANG==='th'?'ออกจากระบบ Discord?':'Log out?')) location.href='/api/logout'; };
    } else {
      btn.innerHTML=`<svg width="15" height="12" viewBox="0 0 127 96" fill="#5865F2" style="vertical-align:-1px" aria-hidden="true"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg> ${LANG==='th'?'ล็อกอิน Discord':'Login with Discord'}`;
      btn.onclick=()=>{ if(!CFG.oauth){ alert(LANG==='th'?'เจ้าของเว็บยังไม่ได้ตั้งค่า Discord OAuth\n(ตั้ง DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET ใน Vercel)':'Discord OAuth is not configured yet'); return; } location.href='/api/login'; };
    }
  }
  const PICK=['targets','inv','carry','ledger','recipeChoice','yield','strong3','ts'];
  const pick=o=>{ const r={}; for(const k of PICK) if(o[k]!==undefined) r[k]=o[k]; return r; };
  function push(){ if(!USER||!CFG.storage) return; clearTimeout(syncT); syncT=setTimeout(async()=>{
    const body=JSON.stringify(pick(S));
    if(body===lastPushed) return; stat.textContent='⟳';
    try{ const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body});
      if(r.ok){ lastPushed=body; stat.textContent='☁'; stat.title=(LANG==='th'?'ซิงก์กับ Discord แล้ว':'synced'); }
      else { stat.textContent='⚠'; stat.title='sync error '+r.status; } }
    catch(e){ stat.textContent='⚠'; stat.title='sync error'; }
  }, 1200); }
  function hookSave(){ if(hooked) return; hooked=true; const orig=window.save; window.save=function(){ S.ts=Date.now(); orig(); push(); }; }
  (async()=>{ try{
    const me=await (await fetch('/api/me')).json(); USER=me.user; CFG=me.configured||CFG; renderBtn();
    if(USER && CFG.storage){
      hookSave();
      try{ const r=await fetch('/api/state'); if(r.ok){ const d=await r.json(); const st=d && d.state;
        if(st && typeof st==='object' && ((+st.ts||0) > (+S.ts||0))){
          Object.assign(S, pick(st)); sanitizeState(S); renderSettings(); update();
          lastPushed=JSON.stringify(pick(S)); stat.textContent='☁';
          toast(LANG==='th'?'โหลดข้อมูลจากบัญชี Discord แล้ว ☁':'Loaded your cloud save ☁');
        } else { push(); }
      } }catch(e){}
    } else if(USER && !CFG.storage){ stat.textContent='⚠'; stat.title=(LANG==='th'?'ยังไม่ได้ต่อฐานข้อมูล (Upstash) — ข้อมูลเก็บในเครื่องเท่านั้น':'No storage linked — local only'); }
  }catch(e){} })();
})();
</script>
